<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="player">

    <h1>🎵 Music Playlist</h1>

    <!-- Album Cover -->
    <div class="cover">
        <img id="cover" src="images/dreams.jpg" alt="Album Cover">
    </div>

    <!-- Song Details -->
    <div class="details">
        <h2 id="title">Dreams</h2>
        <p id="artist">Benjamin Tissot</p>
    </div>

    <!-- Progress Bar -->
    <div class="progress-area">

        <span id="current-time">0:00</span>

        <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0">

        <span id="duration">0:00</span>

    </div>

    <!-- Controls -->
    <div class="controls">

        <button id="prev">
            <i class="fas fa-backward"></i>
        </button>

        <button id="play">
            <i class="fas fa-play"></i>
        </button>

        <button id="next">
            <i class="fas fa-forward"></i>
        </button>

    </div>

    <!-- Volume -->
    <div class="volume">

        <i class="fas fa-volume-up"></i>

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.1"
            value="1">

    </div>

    <!-- Playlist -->
    <div class="playlist">

        <h3>Playlist</h3>

        <ul id="playlist">

            <li data-index="0" class="active">
                🎵 Dreams
            </li>

            <li data-index="1">
                🎵 Once Again
            </li>

            <li data-index="2">
                🎵 Ukulele
            </li>

        </ul>

    </div>

</div>

<!-- Audio -->
<audio id="audio"></audio>

<!-- JavaScript -->
<script src="script.js"></script>

</body>
</html>
